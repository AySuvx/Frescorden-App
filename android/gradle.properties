# org.gradle.java.home NO va acá: es una ruta absoluta de una sola máquina
# (ver commit que rompió CI con "Java home supplied is invalid" al
# encontrarse esa ruta de Windows en el runner Linux). El JDK del sistema
# (java -version) es 1.8.0 y los plugins firebase_* traen su propio Kotlin
# Gradle Plugin, que no compila bien en JDK 8 — pero esa fijación de JDK
# debe vivir en ~/.gradle/gradle.properties de cada máquina (no versionado),
# nunca en este archivo. CI ya resuelve el JDK 17 vía actions/setup-java.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
# Probando true: con AGP 9.1.0 (>=9, soporta Kotlin integrado), el `false`
# dejaba que cada plugin aplicara su propio 'kotlin-android' clásico, y
# eso resolvía una versión de Kotlin distinta para firebase_analytics/
# app_check/auth que terminaba sin generar su clase (cannot find symbol),
# mientras que firebase_core/firebase_ai sí compilaban bien.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
