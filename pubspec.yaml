name: frescorden
description: "Gestión integral de alimentos en el hogar."
publish_to: 'none'

version: 1.19.0+26

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  android_intent_plus: ^5.3.0
  permission_handler: ^11.4.0
  device_info_plus: ^13.2.0
  android_alarm_manager_plus: ^5.1.1
  provider: ^6.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  webview_flutter: ^4.11.0
  google_fonts: ^6.2.1
  # BUG #4 FIX: almacenamiento permanente de imágenes
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  intl: ^0.20.3
  firebase_ai: ^5.0.0
  firebase_app_check: ^0.5.0
  connectivity_plus: ^7.3.1
  firebase_analytics: ^13.0.0
  flutter_animate: ^4.5.2
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4

# image 4.11.0 (pulled transitively by pdf/printing) calls
# ZLibDecoder.decodeLazy, un método que no existe en archive 4.0.9 — la
# versión mínima que `image: ^4.1.0 <=5.0.0` permite y que el resolver de
# pub elige por defecto. Se fuerza una versión de archive más nueva que sí
# lo tiene.
dependency_overrides:
  archive: ^4.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/
    - assets/Frescorden-logo/
    - assets/Frescorden-logo/stickers/
    - assets/Frescorden-logo/banners/
    - assets/iconos/
    - assets/iconos/pequenos/
    - assets/banners-usuario/

flutter_launcher_icons:
  image_path: "assets/Frescorden-logo/app-icon-1024.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Frescorden-logo/android/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/Frescorden-logo/android/ic_launcher_monochrome.png"
  adaptive_icon_foreground_inset: 4
  min_sdk_android: 24
  web:
    generate: true
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
