name: frescorden
description: "Gestión integral de alimentos en el hogar."
publish_to: 'none'

version: 1.4.0+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_storage: ^13.5.0
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  android_intent_plus: ^5.3.0
  permission_handler: ^11.4.0
  device_info_plus: ^13.2.0
  android_alarm_manager_plus: ^5.1.1
  provider: ^6.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  webview_flutter: ^4.11.0
  google_fonts: ^6.2.1
  # BUG #4 FIX: almacenamiento permanente de imágenes
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  intl: ^0.20.3
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    # FIX: assets/ no incluye subcarpetas automáticamente — recetas.json y
    # canastas.json (assets/data/) nunca se empaquetaban en el APK, causando
    # "Unable to load asset: assets/data/canastas.json" en tiempo de
    # ejecución (detectado en prueba manual de Fase 3, historial/precio
    # estimado). Se declara explícitamente.
    - assets/data/
