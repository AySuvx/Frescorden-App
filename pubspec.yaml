name: frescorden
description: "Gestión integral de alimentos en el hogar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_storage: ^12.4.5
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.3.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  android_intent_plus: ^5.3.0
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  android_alarm_manager_plus: ^4.0.7
  provider: ^6.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  webview_flutter: ^4.11.0
  google_fonts: ^6.2.1
  # BUG #4 FIX: almacenamiento permanente de imágenes
  path_provider: ^2.1.5
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    # FIX: assets/ no incluye subcarpetas automáticamente — recetas.json y
    # canastas.json (assets/data/) nunca se empaquetaban en el APK, causando
    # "Unable to load asset: assets/data/canastas.json" en tiempo de
    # ejecución (detectado en prueba manual de Fase 3, historial/precio
    # estimado). Se declara explícitamente.
    - assets/data/
